apiVersion: apps/v1
kind: Deployment
metadata:
  name: good
  namespace: payments-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x
  template:
    metadata:
      labels:
        app: x
        owner: payments-team
        app.kubernetes.io/name: x
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: ghcr.io/acme/x:1.0.0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
---
