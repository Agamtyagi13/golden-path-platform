apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require readiness and liveness probes
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-probes
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, ingress-nginx, backstage, local-path-storage]
      validate:
        message: "Readiness and liveness probes are required for all containers."
        foreach:
          - list: request.object.spec.containers[]
            deny:
              conditions:
                any:
                  - key: readinessProbe
                    operator: AnyNotIn
                    value: "{{ element.keys(@)[] }}"
                  - key: livenessProbe
                    operator: AnyNotIn
                    value: "{{ element.keys(@)[] }}"
